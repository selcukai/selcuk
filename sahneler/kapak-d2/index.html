<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:"Barlow Condensed";color:#fff;
 background:radial-gradient(900px 760px at 38% 66%, #2e3534 0%, #212726 38%, #161a19 70%, #0d100f 100%)}
.photo{position:absolute;left:0;top:0;width:1080px;height:1080px;
 background:var(--img) var(--pos)/cover;
 -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 42%,rgba(0,0,0,.62) 64%,rgba(0,0,0,.22) 84%,transparent 100%);
 filter:saturate(.92) contrast(1.05)}
.topdark{position:absolute;left:0;top:0;width:100%;height:340px;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)}
.rim{position:absolute;inset:0;
 background:
  linear-gradient(270deg, rgba(160,16,26,.55) 0%, rgba(120,10,20,.18) 9%, transparent 24%),
  radial-gradient(700px 420px at 105% 78%, rgba(180,20,32,.30), transparent 70%)}
.rimline{position:absolute;right:0;top:700px;width:5px;height:1100px;
 background:linear-gradient(180deg,transparent,rgba(230,45,56,.85) 45%,transparent);filter:blur(2px)}
.mottle{position:absolute;inset:0;opacity:.32;mix-blend-mode:soft-light}
.grain{position:absolute;inset:0;opacity:.10;mix-blend-mode:overlay}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 260px rgba(0,0,0,.6)}
.txt{position:absolute;left:86px;bottom:300px}
.line{width:64px;height:7px;background:var(--acc);margin-bottom:26px}
.label{font-weight:600;font-size:40px;letter-spacing:.16em;color:#e9ecea;margin-bottom:22px}
.t1,.t2{font-weight:800;font-size:215px;line-height:1.0;letter-spacing:-.005em;text-transform:uppercase}
.t2{color:var(--acc);margin-top:18px}
.t1,.t2{white-space:nowrap}
.badge{position:absolute;left:86px;top:330px;display:flex;font-weight:600;font-size:34px;letter-spacing:.14em}
.badge span{padding:10px 18px}.badge span:first-child{background:#c8141e}.badge span+span{background:rgba(20,24,23,.8);color:#d7dbd9}
</style></head><body>
<div class="photo"></div><div class="topdark"></div>
<svg class="mottle" width="1080" height="1920"><filter id="m"><feTurbulence type="fractalNoise" baseFrequency=".0035 .005" numOctaves="4" seed="7"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#m)"/></svg>
<div class="rim"></div><div class="rimline"></div>
<svg class="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="vig"></div>
<div class="txt">
 <div class="line"></div>
 <div class="label" id="lab"></div>
 <div class="t1" id="t1"></div>
 <div class="t2" id="t2"></div>
</div>
<div class="badge" id="badge"></div>
<script>
const D=__DATA__;
document.body.style.setProperty('--img',`url(foto/${D.foto||D.n+".jpg"})`);
document.body.style.setProperty('--pos',D.pos);
document.body.style.setProperty('--acc',D.acc);
lab.textContent=D.lab;t1.textContent=D.t1;t2.textContent=D.t2;
if(D.badge){const [a,b2]=D.badge.split('|');badge.innerHTML=`<span>${a}</span><span>${b2}</span>`}else badge.remove();
function fit(){let fs=215;for(const e of [t1,t2]){e.style.fontSize='215px';const w=e.scrollWidth;if(w>908)fs=Math.min(fs,Math.floor(215*908/w))}
t1.style.fontSize=t2.style.fontSize=fs+'px';}
</script></body></html>
